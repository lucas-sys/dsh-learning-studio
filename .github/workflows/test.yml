name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: 单元测试
        run: |
          node test/smoke.mjs
          node test/host.mjs
