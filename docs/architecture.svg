<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="学习台架构：浏览器面板通过同源 JSON RPC 调用 Harness Host 半，Host 再调用 ctx.llm 流式生成。">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">学习台 · 架构</text>
  <text x="30" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">一个零构建的 DeepSeek Harness UI 插件：浏览器面板 + Host 半 + 当前模型</text>

  <!-- Browser panel -->
  <rect x="30" y="80" width="290" height="280" rx="14" fill="#f7f8ff" stroke="#c7d2fe"/>
  <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1e293b">浏览器 · 学习台面板</text>
  <text x="50" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">client.js · sidebar.panellist + main</text>

  <text x="50" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">概念 → 学习方面 → 系统框架</text>
  <text x="50" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">划线提问 · 回答卡回跳原文</text>
  <text x="50" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">知识网络（自动 / 手动关联）</text>
  <text x="50" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">费曼 5 题复述与逐题评价</text>
  <text x="50" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">导出 Markdown 笔记</text>

  <rect x="50" y="300" width="250" height="36" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="64" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4338ca">localStorage · dsh-learning-studio/v1</text>

  <!-- RPC arrow -->
  <line x1="320" y1="180" x2="378" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="349" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">POST</text>
  <text x="349" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">JSON</text>

  <!-- Host half -->
  <rect x="380" y="80" width="250" height="280" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="400" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1e293b">Harness · Host 半</text>
  <text x="400" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">index.js · webServer 前缀路由</text>

  <text x="398" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#475569">/_dsh/dsh-learning-studio/*</text>
  <text x="398" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">outline · generate · ask</text>
  <text x="398" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">link · feynman · grade</text>
  <text x="398" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">输入校验 · JSON 容错解析</text>
  <text x="398" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">传输类失败自动重试一次</text>

  <rect x="398" y="296" width="214" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">connection.requestRejection</text>
  <text x="410" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">未登录请求 → 401，不进入模型</text>

  <!-- llm arrow -->
  <line x1="630" y1="170" x2="688" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="659" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#475569">stream()</text>

  <line x1="688" y1="205" x2="630" y2="205" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <text x="659" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#2563eb">chunks</text>

  <!-- LLM -->
  <rect x="690" y="80" width="230" height="210" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="710" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#14532d">ctx.llm</text>
  <text x="710" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4b7a5c">Harness 当前选择的模型</text>

  <text x="710" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#166534">流式 text-delta / finish</text>
  <text x="710" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#166534">不写入会话日志</text>
  <text x="710" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#166534">provider / model 可配置</text>

  <text x="480" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94a3b8">所有学习数据只存在浏览器 localStorage；插件不新增会话事件类型，也不改动 Harness 的会话结构。</text>
</svg>
